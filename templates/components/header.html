{{ define "header" }}
<header class="border-b border-stone-300 bg-white max-h-[64px]">
    <div class="mx-auto flex h-16 max-w-7xl items-center gap-4 px-4">
        <nav class="flex flex-1 items-center gap-8">
            <h2 class="text-2xl font-bold">
                <a href="/" class="inline-block focus:ring-2 focus:ring-pink-500 focus:outline-0">
                    Shop
                    <span aria-hidden="true">👜</span>
                </a>
            </h2>
            <div class="space-x-4">
                {{ if .HasAuthenticated }}
                <a href="/auth/sign-in">Вход</a>
                <a href="/auth/sign-up">Регистрация</a>
                {{ else }}

                {{ end }}
            </div>
        </nav>
    </div>
</header>
{{ end }}
