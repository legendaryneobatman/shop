root = "."
tmp_dir = "tmp"
poll = true

[build]
  bin = "./tmp/main"
  cmd = "go build -o ./tmp/main ./cmd/app/main.go"
  delay = 1000
  exclude_dir = ["assets", "tmp", "vendor"]
  include_ext = ["go", "yaml", "yml", "toml", "env", "html"]

[log]
  time = true

[proxy]
  enabled = true
  proxy_port = 3000    # Порт для браузера
  app_port = 8000